name: Build NRO

on:
  push:
    branches: [ main, feature/cpp-graphical-ui ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Switch GUI dependencies
        run: |
          dkp-pacman -S --noconfirm switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-sdl2_gfx switch-sdl2_mixer switch-mesa switch-glad switch-glm switch-libdrm_nouveau switch-libwebp switch-libpng switch-freetype switch-bzip2 switch-libjpeg-turbo switch-opusfile switch-libopus
      - name: Verify toolchain
        run: |
          command -v aarch64-none-elf-g++
          command -v elf2nro
          test -d "$DEVKITPRO/libnx/include"
      - name: Install icon converter
        run: apt-get update && apt-get install -y imagemagick
      - name: Build
        run: make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: PCHTXT-Manager
          path: PCHTXT-Manager.nro
