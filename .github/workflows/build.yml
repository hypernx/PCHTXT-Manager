name: Build NRO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Switch development libraries
        run: dkp-pacman -S --noconfirm switch-dev
      - name: Build
        run: make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: PCHTXT-Manager
          path: PCHTXT-Manager.nro
