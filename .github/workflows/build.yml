name: Build NRO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Install Switch toolchain and libraries
        run: dkp-pacman -S --noconfirm devkitA64 libnx switch-tools
      - name: Verify toolchain
        run: |
          command -v aarch64-none-elf-gcc
          command -v elf2nro
      - name: Build
        run: make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: PCHTXT-Manager
          path: PCHTXT-Manager.nro
