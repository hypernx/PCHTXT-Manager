name: Build NRO

on:
  push:
    branches: [ main, feature/cpp-graphical-ui ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch Plutonium UI library
        run: git clone --depth 1 https://github.com/XorTroll/Plutonium.git Plutonium
      # The devkita64 Docker image already includes the Switch portlibs.
      # Avoid dkp-pacman here: pkg.devkitpro.org may return HTTP 403 on GitHub-hosted runners.
      - name: Verify toolchain and Switch libraries
        run: |
          command -v aarch64-none-elf-g++
          command -v elf2nro
          test -d "$DEVKITPRO/libnx/include"
          test -d "$DEVKITPRO/portlibs/switch/include/SDL2"
      - name: Install icon converter
        run: apt-get update && apt-get install -y imagemagick
      - name: Build
        run: make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: PCHTXT-Manager
          path: PCHTXT-Manager.nro
